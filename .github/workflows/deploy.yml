name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 或是你使用的預設分支名稱
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 中英內容配對檢查：刻意獨立成一個 job，失敗時不影響下方的部署
  # （網站照常更新），但 commit 上會出現紅色叉並寄出通知信。
  content-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check zh/en content pairs
        run: node scripts/check-content-pairs.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Corepack (for pnpm/yarn)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # 如果用 pnpm 請改為 pnpm

      - name: Install dependencies
        run: npm install

      - name: Build static site
        # 使用 github-pages 預設設定會自動將靜態檔產出至 .output/public
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
